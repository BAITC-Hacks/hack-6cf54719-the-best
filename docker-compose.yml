services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aisana}
      POSTGRES_USER: ${POSTGRES_USER:-aisana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aisana_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisana} -d ${POSTGRES_DB:-aisana}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aisana}:${POSTGRES_PASSWORD:-aisana_dev_password}@db:5432/${POSTGRES_DB:-aisana}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-change-before-deploying}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      ASTANAHUB_REVIEW_EMAIL: ${ASTANAHUB_REVIEW_EMAIL:-catalog@aisana.example.com}
      ASTANAHUB_REVIEW_PASSWORD: ${ASTANAHUB_REVIEW_PASSWORD:-local-demo-change-me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8502}:8501"
    restart: unless-stopped

volumes:
  postgres_data:
